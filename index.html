<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI VietMap Camera Red Light HUD - Android Box Ô Tô</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- AI VIETMAP HUD FLOATING OVERLAY -->
    <div class="floating-widget theme-blue" id="floatingWidget">
        <!-- TOP HEADER HUD BAR -->
        <div class="widget-header" id="widgetHeader">
            <div class="drag-handle" title="Chạm giữ để di chuyển HUD trên màn hình ô tô">
                <button class="ai-live-badge-btn" onclick="toggleStatusPanel(event)" title="Bấm để mở Báo cáo Realtime">
                    <span class="pulse-dot" id="camStatusDot"></span>
                    <span class="badge-text" id="camStatusText">CAM VIETMAP AI</span>
                    <span class="badge-arrow">▶</span>
                </button>
            </div>
            <div class="widget-controls">
                <button class="icon-btn" id="infoBtn" onclick="toggleStatusPanel(event)" title="Xem Báo cáo Trạng thái">📊</button>
                <button class="icon-btn" id="audioBtn" onclick="handleToggleAudio(event)" title="Bật/Tắt Âm Thanh">🔊</button>
                <button class="icon-btn btn-close" onclick="handleCloseApp(event)" title="Đóng Tool">✖</button>
            </div>
        </div>

        <!-- BÁO CÁO TRẠNG THÁI REALTIME (SIDE-BY-SIDE SIDEBAR) -->
        <div class="status-expanded-card hidden" id="statusExpandedCard">
            <div class="card-header">
                <span class="card-title">📊 BÁO CÁO KẾT NỐI REALTIME</span>
                <button class="card-close-btn" onclick="toggleStatusPanel(event)">✖</button>
            </div>
            <div class="card-body">
                <div class="status-item">
                    <span class="item-label">📶 Wi-Fi Kết Nối:</span>
                    <span class="item-val val-wifi" id="valWifi">Đang dò Wi-Fi...</span>
                </div>
                <div class="status-item">
                    <span class="item-label">📹 Tình Hình Video:</span>
                    <span class="item-val val-stream" id="valStream">Chưa kết nối Camera</span>
                </div>
                <div class="status-item">
                    <span class="item-label">🚗 Tốc Độ GPS Xe:</span>
                    <span class="item-val val-gps" id="valGps">0 km/h (Sẵn sàng)</span>
                </div>
                <div class="status-item">
                    <span class="item-label">🤖 Trạng Thái AI:</span>
                    <span class="item-val val-ai" id="valAi">Đang chờ xe dừng đèn đỏ</span>
                </div>
            </div>
            <div class="card-footer-tip">
                💡 Tự động ẩn khi xe di chuyển hoặc hết đèn đỏ
            </div>
        </div>

        <!-- MAIN HUD DISPLAY BODY -->
        <div class="hud-body">
            <!-- CIRCULAR PROGRESS RING & COUNTDOWN DIGITS -->
            <div class="hud-circle-container">
                <svg class="progress-ring" width="180" height="180" viewBox="0 0 180 180">
                    <circle class="progress-ring-track" cx="90" cy="90" r="76"></circle>
                    <circle class="progress-ring-fill" id="progressFill" cx="90" cy="90" r="76"></circle>
                </svg>
                <div class="hud-center-content">
                    <div class="hud-digits" id="digitalDisplay">
                        <span class="digit" id="digit1">0</span>
                        <span class="digit" id="digit2">0</span>
                    </div>
                    <div class="hud-unit">GIÂY DỪNG ĐÈN ĐỎ</div>
                </div>
            </div>

            <!-- DYNAMIC STATUS BADGE -->
            <div class="hud-status-badge" id="statusBadge">
                <span class="status-icon" id="statusIcon">🛑</span>
                <span class="status-text" id="statusText">ĐÈN ĐỎ AI - ĐANG ĐẾM</span>
            </div>
        </div>

        <!-- FLUSH CORNER RESIZE HANDLE -->
        <div class="resize-handle" id="resizeHandle" title="Kéo góc để đổi kích thước HUD">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="19" y1="9" x2="9" y2="19"></line>
                <line x1="19" y1="13" x2="13" y2="19"></line>
                <line x1="19" y1="17" x2="17" y2="19"></line>
            </svg>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
