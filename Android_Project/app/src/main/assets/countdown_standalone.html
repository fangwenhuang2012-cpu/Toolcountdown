<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floating Digital Countdown - Android Box Ô Tô</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#00f3ff">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').catch(function(){});
            });
        }
    </script>
    <style>
        :root {
            color-scheme: normal;
            --bg-dark: rgba(10, 14, 23, 0.85);
            --bg-opacity: 0.60;
            --card-bg: rgba(15, 23, 42, var(--bg-opacity, 0.60));
            --card-border: rgba(0, 243, 255, 0.35);
            --primary: #00f3ff;
            --primary-glow: rgba(0, 243, 255, 0.45);
            --warning: #ffaa00;
            --warning-glow: rgba(255, 170, 0, 0.55);
            --danger: #ff0055;
            --danger-glow: rgba(255, 0, 85, 0.65);
            --success: #00ff88;
            --success-glow: rgba(0, 255, 136, 0.65);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --digital-font: 'Orbitron', 'Courier New', Courier, monospace;
            --sans-font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        img, svg, canvas, video {
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
        }

        html, body {
            background: transparent !important;
            background-color: transparent !important;
            color: var(--text-main);
            font-family: var(--sans-font);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            pointer-events: none !important;
        }

        body.is-android-native {
            width: 100% !important;
            height: 100% !important;
        }

        body.is-android-native .floating-widget {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            transform: none !important;
        }

        body.is-android-native .floating-bubble {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: auto !important;
            bottom: auto !important;
            width: 100% !important;
            height: 100% !important;
            transform: none !important;
        }

        .overlay-background {
            display: none !important;
        }

        /* DRAGGABLE FLOATING POPUP WIDGET - COMPACT FOR CAR ANDROID BOX SCREENS */
        .floating-widget {
            position: fixed;
            top: 10px;
            left: 15px;
            width: min(420px, calc(100vw - 12px));
            height: min(290px, calc(100vh - 12px));
            max-height: calc(100vh - 12px);
            background: rgba(15, 23, 42, var(--bg-opacity, 0.75));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid var(--card-border);
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65), 0 0 18px rgba(0, 243, 255, 0.2);
            z-index: 999;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            will-change: transform;
            transition: opacity 0.25s ease, border-color 0.2s ease, transform 0.2s ease, width 0.25s ease, height 0.25s ease, background 0.2s ease;
            pointer-events: auto !important;
        }

        .floating-widget.is-dragging,
        .floating-bubble.is-dragging {
            transition: none !important;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.85), 0 0 35px rgba(0, 243, 255, 0.4);
            cursor: grabbing;
        }

        .floating-widget.hidden {
            opacity: 0;
            pointer-events: none !important;
            visibility: hidden;
            display: none !important;
        }

        .widget-header {
            background: rgba(15, 23, 42, 0.85);
            padding: 0.5rem 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            cursor: grab;
            touch-action: none;
            user-select: none;
            flex-shrink: 0;
        }

        .widget-header:active {
            cursor: grabbing;
        }

        .drag-handle {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .drag-icon {
            font-size: 1.1rem;
            color: var(--primary);
            letter-spacing: -2px;
            flex-shrink: 0;
        }

        .widget-title {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .widget-controls {
            display: flex;
            gap: 0.25rem;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.98rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .icon-btn:hover, .icon-btn:active {
            background: var(--primary);
            color: #000;
        }

        .icon-btn-text {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 0 0.5rem;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            font-family: var(--sans-font);
            white-space: nowrap;
        }

        .icon-btn-text:hover, .icon-btn-text:active {
            background: var(--primary);
            color: #000;
        }

        .icon-btn-close {
            background: rgba(255, 0, 85, 0.25) !important;
            border: 1px solid rgba(255, 0, 85, 0.5) !important;
            color: #ff0055 !important;
            font-weight: 900 !important;
            font-size: 1.1rem !important;
        }

        .icon-btn-close:hover, .icon-btn-close:active {
            background: var(--danger) !important;
            color: #ffffff !important;
            border-color: var(--danger) !important;
        }

        /* Widget Body: ALWAYS 2-COLUMN LANDSCAPE GRID (Numpad STRICTLY on the Left) */
        .widget-body {
            padding: 0.7rem 0.8rem;
            display: grid !important;
            grid-template-columns: minmax(160px, 195px) 1fr !important;
            gap: 0.75rem;
            align-items: stretch !important;
            overflow: hidden;
            flex: 1;
            width: 100%;
            height: calc(100% - 44px);
        }

        /* PHÍA BÊN TRÁI: BÀN PHÍM SỐ (ALWAYS ORDER 1 ON THE LEFT) */
        .body-left {
            display: flex;
            flex-direction: column;
            justify-content: stretch;
            width: 100%;
            height: 100%;
            order: 1 !important;
            min-width: 0 !important;
            overflow: hidden;
        }

        /* PHÍA BÊN PHẢI: ĐỒNG HỒ & ĐIỀU KHIỂN (ALWAYS ORDER 2 ON THE RIGHT) */
        .body-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 0.45rem;
            width: 100%;
            height: 100%;
            order: 2 !important;
            min-width: 0 !important;
            overflow: hidden;
        }

        .status-indicator {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
            background: rgba(0, 243, 255, 0.12);
            padding: 0.2rem 0.65rem;
            border-radius: 14px;
            border: 1px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .digital-display {
            font-family: var(--digital-font);
            font-size: clamp(2.8rem, 8vw, 4.8rem);
            font-weight: 900;
            line-height: 1;
            color: var(--primary);
            text-shadow: 0 0 22px var(--primary-glow);
            display: flex;
            gap: 0.05ch;
            background: rgba(4, 7, 17, 0.85);
            padding: 0.5rem 0.65rem;
            border-radius: 16px;
            border: 2px solid rgba(0, 243, 255, 0.35);
            width: 100%;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            flex: 1;
        }

        .digit {
            display: inline-block;
            min-width: 0.55em;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .unit-label {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-top: -0.1rem;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0.4rem;
            width: 100%;
            height: 100%;
        }

        .num-btn {
            background: rgba(20, 31, 54, 0.85);
            color: #fff;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            padding: 0.2rem 0.05rem;
            font-family: var(--digital-font);
            font-size: 1.35rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.12s, transform 0.1s;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.35);
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .num-btn:active {
            background: var(--primary);
            color: #000;
            transform: scale(0.94);
        }

        .btn-clear { color: var(--danger); font-weight: 900; font-size: 0.85rem; border-color: rgba(255, 0, 85, 0.4); }
        .btn-backspace { color: var(--warning); font-size: 1.15rem; border-color: rgba(255, 170, 0, 0.4); }

        .quick-actions {
            display: flex;
            gap: 0.4rem;
            width: 100%;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 0.65rem 0.25rem;
            border-radius: 11px;
            font-family: var(--sans-font);
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.15s;
            white-space: nowrap;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: #fff;
        }

        .btn-pause {
            background: linear-gradient(135deg, #ffaa00, #e67e22);
            color: #000;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .preset-row {
            display: flex;
            gap: 0.35rem;
            width: 100%;
        }

        .preset-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-main);
            padding: 0.52rem 0.2rem;
            border-radius: 9px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            flex: 1;
            text-align: center;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            min-width: 0;
        }

        .preset-chip:hover, .preset-chip:active {
            background: rgba(0, 243, 255, 0.25);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* RUNNING MODE: HIDE LEFT NUMPAD & PRESETS, ENLARGE DISPLAY BY 50%+ */
        .floating-widget.running-mode {
            width: min(520px, calc(100vw - 12px));
            height: auto !important;
            max-height: calc(100vh - 12px);
        }

        .floating-widget.running-mode .widget-body {
            display: flex !important;
            flex-direction: column !important;
            padding: 0.85rem 1rem !important;
            gap: 0.75rem !important;
            height: auto !important;
        }

        .floating-widget.running-mode .body-left,
        .floating-widget.running-mode .preset-row {
            display: none !important;
        }

        .floating-widget.running-mode .digital-display {
            font-size: clamp(5.8rem, 18vw, 9rem);
            padding: 0.85rem 1rem;
            min-height: 180px;
            border-width: 3px;
            border-radius: 18px;
            text-shadow: 0 0 45px var(--primary-glow);
        }

        .floating-widget.running-mode .btn {
            padding: 0.75rem 0.4rem;
            font-size: 0.95rem;
            border-radius: 12px;
        }

        .floating-widget.warning-mode {
            border-color: var(--warning);
            box-shadow: 0 0 35px var(--warning-glow);
        }
        .floating-widget.warning-mode .digital-display {
            color: var(--warning);
            text-shadow: 0 0 35px var(--warning-glow);
        }

        .floating-widget.critical-mode {
            border-color: var(--danger);
            box-shadow: 0 0 45px var(--danger-glow);
            animation: flash-border 0.5s infinite alternate;
        }
        .floating-widget.critical-mode .digital-display {
            color: var(--danger);
            text-shadow: 0 0 45px var(--danger-glow);
        }

        @keyframes flash-border {
            0% { border-color: var(--danger); }
            100% { border-color: #ffffff; }
        }

        /* MINIMIZED BUBBLE */
        .floating-bubble {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 54px;
            height: 54px;
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(12px);
            border: 2px solid var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 16px var(--primary-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            touch-action: none;
            will-change: transform;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.25s ease;
            pointer-events: auto !important;
        }

        .floating-bubble.hidden { display: none !important; pointer-events: none !important; }
        .bubble-content { display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        .bubble-icon { font-size: 0.85rem !important; line-height: 1 !important; max-width: 20px; max-height: 20px; overflow: hidden; }
        .bubble-digits { font-family: var(--digital-font); font-size: 0.85rem; font-weight: 900; color: var(--primary); margin-top: 1px; line-height: 1; }

        /* MEDIA QUERY FOR SMALL MOBILE / PORTRAIT APK SCREENS (< 480px) */
        @media screen and (max-width: 480px) {
            .floating-widget {
                width: calc(100vw - 8px);
                top: 8px;
                left: 4px;
                border-radius: 16px;
            }

            .widget-body {
                grid-template-columns: 120px 1fr !important;
                gap: 0.35rem !important;
                padding: 0.45rem !important;
            }

            .digital-display {
                font-size: 2.2rem !important;
                padding: 0.25rem 0.3rem !important;
            }

            .num-btn {
                padding: 0.35rem 0.05rem !important;
                font-size: 0.92rem !important;
            }

            .btn {
                font-size: 0.68rem !important;
                padding: 0.4rem 0.1rem !important;
            }

            .preset-chip {
                font-size: 0.68rem !important;
                padding: 0.3rem 0.05rem !important;
            }
        }
    </style>
</head>
<body>
    <!-- MAIN FLOATING POPUP WIDGET -->
    <div class="floating-widget" id="floatingWidget">
        <div class="widget-header" id="widgetHeader">
            <div class="drag-handle">
                <span class="drag-icon">⣿</span>
                <span class="widget-title" id="widgetTitle">ĐẾM NGƯỢC POPUP</span>
            </div>
            <div class="widget-controls">
                <button class="icon-btn-text" id="autoMinBtn" onclick="handleToggleAutoMin(event)">🎈 TỰ ẨN</button>
                <button class="icon-btn" id="audioBtn" onclick="handleToggleAudio(event)">🔊</button>
                <button class="icon-btn" title="Thu nhỏ bong bóng" onclick="minimizeToBubble(event)">⚊</button>
                <button class="icon-btn icon-btn-close" title="Tắt ứng dụng đếm ngược" onclick="closeApp(event)">✕</button>
            </div>
        </div>

        <div class="widget-body">
            <!-- PHÍA BÊN TRÁI: BÀN PHÍM SỐ NGANG -->
            <div class="body-left">
                <div class="numpad-grid">
                    <button class="num-btn" onclick="handleNum('1', event)">1</button>
                    <button class="num-btn" onclick="handleNum('2', event)">2</button>
                    <button class="num-btn" onclick="handleNum('3', event)">3</button>
                    <button class="num-btn" onclick="handleNum('4', event)">4</button>
                    <button class="num-btn" onclick="handleNum('5', event)">5</button>
                    <button class="num-btn" onclick="handleNum('6', event)">6</button>
                    <button class="num-btn" onclick="handleNum('7', event)">7</button>
                    <button class="num-btn" onclick="handleNum('8', event)">8</button>
                    <button class="num-btn" onclick="handleNum('9', event)">9</button>
                    <button class="num-btn btn-clear" title="Xoá hết" onclick="handleClear(event)">XOÁ</button>
                    <button class="num-btn" onclick="handleNum('0', event)">0</button>
                    <button class="num-btn btn-backspace" title="Xoá 1 số" onclick="handleBackspace(event)">⌫</button>
                </div>
            </div>

            <!-- PHÍA BÊN PHẢI: ĐỒNG HỒ, NÚT BẮT ĐẦU & PRESETS -->
            <div class="body-right">
                <div class="status-indicator" id="statusIndicator">
                    <span id="statusIcon">⏱️</span> <span id="statusText">SẴN SÀNG</span>
                </div>
                
                <div class="digital-display" id="digitalDisplay" title="Chạm để xoá thời gian" onclick="handleClear(event)">
                    <span class="digit" id="digit1">0</span>
                    <span class="digit" id="digit2">0</span>
                    <span class="digit" id="digit3">0</span>
                </div>
                <div class="unit-label">GIÂY</div>

                <!-- PHÍM ĐIỀU KHIỂN CHÍNH -->
                <div class="quick-actions">
                    <button id="startBtn" class="btn btn-start" onclick="handleStart(event)">▶ BẮT ĐẦU</button>
                    <button id="pauseBtn" class="btn btn-pause" onclick="handlePause(event)">⏸ DỪNG</button>
                    <button id="resetBtn" class="btn btn-reset" onclick="handleReset(event)">↺ ĐẶT LẠI</button>
                </div>

                <!-- PHÍM CHỌN NHANH PRESETS: 60s, 80s, 100s, 120s -->
                <div class="preset-row">
                    <button class="preset-chip" onclick="handlePreset(60, event)">60s</button>
                    <button class="preset-chip" onclick="handlePreset(80, event)">80s</button>
                    <button class="preset-chip" onclick="handlePreset(100, event)">100s</button>
                    <button class="preset-chip" onclick="handlePreset(120, event)">120s</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MINIMIZED BUBBLE -->
    <div class="floating-bubble hidden" id="floatingBubble" onclick="showWidget(event)">
        <div class="bubble-content">
            <span class="bubble-icon" id="bubbleIcon">⏱️</span>
            <span class="bubble-digits" id="bubbleDigits">030</span>
        </div>
    </div>

    <script>
        // Safe Storage Helper (In-memory fallback if localStorage throws)
        const memoryStorage = {};
        const safeStorage = {
            getItem: function(key, defaultVal = null) {
                try {
                    const val = localStorage.getItem(key);
                    return val !== null ? val : (memoryStorage[key] !== undefined ? memoryStorage[key] : defaultVal);
                } catch(e) {
                    return memoryStorage[key] !== undefined ? memoryStorage[key] : defaultVal;
                }
            },
            setItem: function(key, val) {
                try { localStorage.setItem(key, val); } catch(e) {}
                memoryStorage[key] = String(val);
            }
        };

        // State variables
        let countdownTime = 30;
        let initialSetTime = 30;
        let targetEndTime = 0;
        let isRunning = false;
        let inputBuffer = "030";
        let audioEnabled = safeStorage.getItem('openclaw_countdown_audio') !== 'false';
        let autoMinimizeOnComplete = safeStorage.getItem('openclaw_countdown_automin') !== 'false';

        let audioCtx = null;
        let tickerTimer = null;
        let workerTimer = null;
        let lastInputGuardTime = 0;

        // Input Debounce Guard (100ms throttle, zero blocking)
        function guardInput(e) {
            const now = Date.now();
            if (now - lastInputGuardTime < 100) return false;
            lastInputGuardTime = now;
            return true;
        }

        // Clean & Robust Web Audio Synthesizer
        function playBeep(freq = 1200, duration = 0.1, type = 'sine', volume = 0.6) {
            if (!audioEnabled) return;
            try {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioCtxClass) {
                    audioCtx = new AudioCtxClass();
                }
                if (audioCtx) {
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(() => {});
                    }
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    
                    gain.gain.setValueAtTime(volume, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + duration);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(now);
                    osc.stop(now + duration);
                }
            } catch(e) {}
        }

        // Mốc 30s, 20s, 10s -> Kêu 2 tiếng liên tiếp!
        function playDoubleTing() {
            playBeep(1200, 0.1, 'sine', 0.65);
            setTimeout(() => playBeep(1500, 0.12, 'sine', 0.7), 130);
        }

        // Từ 5s trở xuống (5, 4, 3, 2, 1) -> Mỗi giây kêu 1 tiếng!
        function playSingleTick() {
            playBeep(1400, 0.09, 'sine', 0.7);
        }

        // Khi về 0s -> Chuông báo hoàn thành
        function playFinishAlarm() {
            if (!audioEnabled) return;
            try {
                const notes = [880, 1108.73, 1318.51, 1760];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        playBeep(freq, 0.18, 'triangle', 0.7);
                    }, idx * 110);
                });
            } catch(e) {}
        }

        // DOM elements
        let floatingWidget, widgetHeader, floatingBubble, bubbleDigits, bubbleIcon;
        let digit1, digit2, digit3, statusIndicator, statusIcon, statusText, widgetTitle;
        let startBtn, pauseBtn, resetBtn, audioBtn, autoMinBtn;

        function getElements() {
            floatingWidget = document.getElementById('floatingWidget');
            widgetHeader = document.getElementById('widgetHeader');
            floatingBubble = document.getElementById('floatingBubble');
            bubbleDigits = document.getElementById('bubbleDigits');
            bubbleIcon = document.getElementById('bubbleIcon');

            digit1 = document.getElementById('digit1');
            digit2 = document.getElementById('digit2');
            digit3 = document.getElementById('digit3');
            statusIndicator = document.getElementById('statusIndicator');
            statusIcon = document.getElementById('statusIcon');
            statusText = document.getElementById('statusText');
            widgetTitle = document.getElementById('widgetTitle');

            startBtn = document.getElementById('startBtn');
            pauseBtn = document.getElementById('pauseBtn');
            resetBtn = document.getElementById('resetBtn');
            audioBtn = document.getElementById('audioBtn');
            autoMinBtn = document.getElementById('autoMinBtn');
        }

        function updateDisplay() {
            const formatted = String(countdownTime).padStart(3, '0');
            const digits = formatted.slice(-3);

            if (digit1) digit1.textContent = digits[0];
            if (digit2) digit2.textContent = digits[1];
            if (digit3) digit3.textContent = digits[2];
            if (bubbleDigits) bubbleDigits.textContent = formatted;

            if (startBtn) startBtn.disabled = isRunning || countdownTime <= 0;
            if (pauseBtn) pauseBtn.disabled = !isRunning;

            renderPiPCanvas();
        }

        let lastBeepedMilestone = -1;

        // Ticker Logic with Date.now() Real-World Time Tracking
        function tick() {
            if (!isRunning) return;
            const now = Date.now();
            const calcRem = Math.max(0, Math.ceil((targetEndTime - now) / 1000));

            if (calcRem !== countdownTime) {
                const prevTime = countdownTime;
                countdownTime = calcRem;
                updateDisplay();

                // 30, 20, 10 seconds -> 2 consecutive beeps!
                if (prevTime >= 30 && countdownTime <= 30 && lastBeepedMilestone !== 30) {
                    lastBeepedMilestone = 30;
                    playDoubleTing();
                } else if (prevTime >= 20 && countdownTime <= 20 && lastBeepedMilestone !== 20) {
                    lastBeepedMilestone = 20;
                    playDoubleTing();
                } else if (prevTime >= 10 && countdownTime <= 10 && lastBeepedMilestone !== 10) {
                    lastBeepedMilestone = 10;
                    playDoubleTing();
                } else if (countdownTime <= 5 && countdownTime >= 1 && lastBeepedMilestone !== countdownTime) {
                    lastBeepedMilestone = countdownTime;
                    playSingleTick();
                }

                if (countdownTime <= 10 && countdownTime > 5) {
                    if (floatingWidget) {
                        floatingWidget.classList.add('warning-mode');
                        floatingWidget.classList.remove('critical-mode');
                    }
                } else if (countdownTime <= 5 && countdownTime > 0) {
                    if (floatingWidget) {
                        floatingWidget.classList.remove('warning-mode');
                        floatingWidget.classList.add('critical-mode');
                    }
                }
            }

            if (countdownTime <= 0) {
                stopTimer();
                playFinishAlarm();

                if (statusText) statusText.textContent = "HOÀN THÀNH";

                setTimeout(() => {
                    if (autoMinimizeOnComplete) {
                        minimizeToBubble();
                    } else {
                        if (floatingWidget) floatingWidget.classList.add('hidden');
                        if (floatingBubble) floatingBubble.classList.remove('hidden');
                        if (window.AndroidBridge) {
                            setTimeout(syncNativeBounds, 50);
                        }
                    }
                }, 1200);
            }
        }

        function startTickerEngine() {
            stopTickerEngine();
            tickerTimer = setInterval(tick, 150);

            try {
                const blob = new Blob([`
                    let timer = null;
                    self.onmessage = function(e) {
                        if (e.data === 'start') {
                            clearInterval(timer);
                            timer = setInterval(function() { self.postMessage('tick'); }, 150);
                        } else if (e.data === 'stop') {
                            clearInterval(timer);
                        }
                    };
                `], { type: 'application/javascript' });
                workerTimer = new Worker(URL.createObjectURL(blob));
                workerTimer.onmessage = function() { tick(); };
                workerTimer.postMessage('start');
            } catch(e) {}
        }

        function stopTickerEngine() {
            if (tickerTimer) clearInterval(tickerTimer);
            tickerTimer = null;
            if (workerTimer) {
                try { workerTimer.postMessage('stop'); workerTimer.terminate(); } catch(e) {}
                workerTimer = null;
            }
        }

        function startTimer() {
            if (countdownTime <= 0) return;

            initialSetTime = countdownTime;
            targetEndTime = Date.now() + (countdownTime * 1000);
            isRunning = true;

            if (statusText) statusText.textContent = "ĐANG ĐẾM";
            if (floatingWidget) floatingWidget.classList.add('running-mode');

            // Beep 2 times if starting at 30, 20, or 10
            if (countdownTime === 30) {
                lastBeepedMilestone = 30;
                playDoubleTing();
            } else if (countdownTime === 20) {
                lastBeepedMilestone = 20;
                playDoubleTing();
            } else if (countdownTime === 10) {
                lastBeepedMilestone = 10;
                playDoubleTing();
            } else if (countdownTime <= 5 && countdownTime >= 1) {
                lastBeepedMilestone = countdownTime;
                playSingleTick();
            } else {
                lastBeepedMilestone = -1;
            }

            updateDisplay();
            startTickerEngine();
        }

        function pauseTimer() {
            if (isRunning) {
                stopTickerEngine();
                isRunning = false;
                if (statusText) statusText.textContent = "TẠM DỪNG";
                if (floatingWidget) {
                    floatingWidget.classList.remove('running-mode', 'warning-mode', 'critical-mode');
                }
                updateDisplay();
            }
        }

        function stopTimer() {
            stopTickerEngine();
            isRunning = false;
            if (floatingWidget) {
                floatingWidget.classList.remove('running-mode', 'warning-mode', 'critical-mode');
            }
            updateDisplay();
        }

        function resetTimer() {
            stopTimer();
            lastBeepedMilestone = -1;
            countdownTime = initialSetTime || 30;
            inputBuffer = String(countdownTime).padStart(3, '0');
            if (statusText) statusText.textContent = "SẴN SÀNG";
            updateDisplay();
        }

        // Action Handlers bound directly to HTML onclick
        function handlePreset(sec, e) {
            if (!guardInput(e)) return;
            stopTimer();
            lastBeepedMilestone = -1;
            countdownTime = sec;
            initialSetTime = sec;
            inputBuffer = String(sec).padStart(3, '0');
            safeStorage.setItem('openclaw_countdown_last_time', countdownTime);
            updateDisplay();
            startTimer();
        }

        function handleNum(val, e) {
            if (!guardInput(e)) return;
            if (isRunning) stopTimer();
            if (inputBuffer === "030" || inputBuffer === "000" || countdownTime === 0) {
                inputBuffer = String(val);
            } else if (inputBuffer.length >= 3) {
                inputBuffer = inputBuffer.slice(1) + String(val);
            } else {
                inputBuffer += String(val);
            }
            countdownTime = parseInt(inputBuffer, 10) || 0;
            countdownTime = Math.min(999, countdownTime);
            initialSetTime = countdownTime;
            safeStorage.setItem('openclaw_countdown_last_time', countdownTime);
            updateDisplay();
        }

        function handleClear(e) {
            if (!guardInput(e)) return;
            if (isRunning) stopTimer();
            inputBuffer = "000";
            countdownTime = 0;
            initialSetTime = 0;
            safeStorage.setItem('openclaw_countdown_last_time', 0);
            updateDisplay();
        }

        function handleBackspace(e) {
            if (!guardInput(e)) return;
            if (isRunning) return;
            if (inputBuffer.length > 0) {
                inputBuffer = inputBuffer.slice(0, -1);
            }
            countdownTime = parseInt(inputBuffer, 10) || 0;
            safeStorage.setItem('openclaw_countdown_last_time', countdownTime);
            updateDisplay();
        }

        function handleStart(e) {
            if (!guardInput(e)) return;
            startTimer();
        }

        function handlePause(e) {
            if (!guardInput(e)) return;
            pauseTimer();
        }

        function handleReset(e) {
            if (!guardInput(e)) return;
            resetTimer();
        }

        function handleToggleAudio(e) {
            if (!guardInput(e)) return;
            audioEnabled = !audioEnabled;
            if (audioBtn) audioBtn.textContent = audioEnabled ? '🔊' : '🔇';
            safeStorage.setItem('openclaw_countdown_audio', audioEnabled);
        }

        function handleToggleAutoMin(e) {
            if (!guardInput(e)) return;
            autoMinimizeOnComplete = !autoMinimizeOnComplete;
            if (autoMinBtn) autoMinBtn.textContent = autoMinimizeOnComplete ? '🎈 TỰ ẨN' : '📌 GIỮ NGUYÊN';
            safeStorage.setItem('openclaw_countdown_automin', autoMinimizeOnComplete);
        }



        let nativeWidgetPos = { x: 20, y: 20 };
        let nativeBubblePos = { x: 20, y: 20 };

        function closeApp(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (window.AndroidBridge && typeof window.AndroidBridge.closeApp === 'function') {
                window.AndroidBridge.closeApp();
            } else {
                if (floatingWidget) floatingWidget.classList.add('hidden');
                if (floatingBubble) floatingBubble.classList.add('hidden');
                try { window.close(); } catch(err) {}
                
                let closedMsg = document.getElementById('webClosedMsg');
                if (!closedMsg) {
                    closedMsg = document.createElement('div');
                    closedMsg.id = 'webClosedMsg';
                    closedMsg.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,0.95);color:#fff;padding:24px 32px;border-radius:18px;border:2px solid #00f3ff;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.85);z-index:99999;font-family:sans-serif;pointer-events:auto;';
                    closedMsg.innerHTML = '<h3 style="margin-bottom:10px;color:#00f3ff;font-size:1.1rem;">⏱️ Ứng dụng đếm ngược đã đóng</h3><p style="color:#94a3b8;font-size:0.85rem;margin-bottom:18px;line-height:1.4;">Trên Android Box APK, ứng dụng sẽ <b>tắt hoàn toàn khỏi màn hình</b> và dừng dịch vụ chạy ngầm.</p><button onclick="location.reload()" style="background:linear-gradient(135deg, #00d2ff, #0072ff);color:#fff;border:none;padding:10px 22px;font-weight:bold;border-radius:10px;cursor:pointer;font-size:0.9rem;">🔄 Mở lại đếm ngược</button>';
                    document.body.appendChild(closedMsg);
                } else {
                    closedMsg.style.display = 'block';
                }
            }
        }

        function syncNativeBounds() {
            if (!window.AndroidBridge || typeof window.AndroidBridge.updateWindowBounds !== 'function') return;
            const isWidgetVisible = floatingWidget && !floatingWidget.classList.contains('hidden');
            const dpr = window.devicePixelRatio || 1;

            if (isWidgetVisible) {
                // FIXED target DP bounds - NEVER read getBoundingClientRect() to avoid feedback loop exponential scaling!
                const isRunningMode = floatingWidget.classList.contains('running-mode');
                const targetW_dp = isRunningMode ? 340 : 400;
                const targetH_dp = isRunningMode ? 190 : 260;
                const w = Math.round(targetW_dp * dpr);
                const h = Math.round(targetH_dp * dpr);
                window.AndroidBridge.updateWindowBounds(nativeWidgetPos.x, nativeWidgetPos.y, w, h);
            } else if (floatingBubble) {
                const bubbleDp = 54;
                const bubblePx = Math.round(bubbleDp * dpr);
                window.AndroidBridge.updateWindowBounds(nativeBubblePos.x, nativeBubblePos.y, bubblePx, bubblePx);
            }
        }

        function showWidget(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (document.pictureInPictureElement) {
                document.exitPictureInPicture().catch(() => {});
            }
            if (floatingWidget) floatingWidget.classList.remove('hidden');
            if (floatingBubble) floatingBubble.classList.add('hidden');
            if (window.AndroidBridge) {
                setTimeout(syncNativeBounds, 50);
            }
        }

        function minimizeToBubble(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (floatingWidget) floatingWidget.classList.add('hidden');
            if (floatingBubble) floatingBubble.classList.remove('hidden');
            if (window.AndroidBridge) {
                setTimeout(syncNativeBounds, 50);
            }
        }

        // Drag and Drop Logic (Supports both browser fallback & native Android WindowManager moving)
        function makeDraggable(element, handleElement) {
            if (!element) return;
            const target = handleElement || element;
            let currentX = 0, currentY = 0, initialX = 0, initialY = 0;
            let isDragging = false, startX = 0, startY = 0, totalMoved = 0;
            let lastScreenX = 0, lastScreenY = 0;

            const getPos = (e) => {
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY, screenX: e.touches[0].screenX, screenY: e.touches[0].screenY };
                if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, screenX: e.changedTouches[0].screenX, screenY: e.changedTouches[0].screenY };
                return { x: e.clientX || 0, y: e.clientY || 0, screenX: e.screenX || 0, screenY: e.screenY || 0 };
            };

            const dragStart = (e) => {
                if (e.target.closest('button, input, textarea')) return;
                const pos = getPos(e);
                startX = pos.x; startY = pos.y;
                lastScreenX = pos.screenX; lastScreenY = pos.screenY;
                totalMoved = 0; isDragging = true;

                if (!window.AndroidBridge) {
                    currentX = parseFloat(element.dataset.x || 0);
                    currentY = parseFloat(element.dataset.y || 0);
                    initialX = startX - currentX;
                    initialY = startY - currentY;
                }
                element.classList.add('is-dragging');

                const dragMove = (e) => {
                    if (!isDragging) return;
                    const p = getPos(e);
                    totalMoved = Math.hypot(p.x - startX, p.y - startY);
                    if (totalMoved > 5 && e.cancelable) e.preventDefault();

                    if (window.AndroidBridge && typeof window.AndroidBridge.moveWindow === 'function') {
                        const dx = Math.round(p.screenX - lastScreenX);
                        const dy = Math.round(p.screenY - lastScreenY);
                        if (dx !== 0 || dy !== 0) {
                            window.AndroidBridge.moveWindow(dx, dy);
                            lastScreenX = p.screenX;
                            lastScreenY = p.screenY;
                            if (element === floatingWidget) {
                                nativeWidgetPos.x = Math.max(0, nativeWidgetPos.x + dx);
                                nativeWidgetPos.y = Math.max(0, nativeWidgetPos.y + dy);
                            } else {
                                nativeBubblePos.x = Math.max(0, nativeBubblePos.x + dx);
                                nativeBubblePos.y = Math.max(0, nativeBubblePos.y + dy);
                            }
                        }
                    } else {
                        currentX = p.x - initialX;
                        currentY = p.y - initialY;
                        element.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
                        element.dataset.x = currentX;
                        element.dataset.y = currentY;
                    }
                };

                const dragEnd = () => {
                    if (!isDragging) return;
                    isDragging = false;
                    element.classList.remove('is-dragging');
                    document.removeEventListener('mousemove', dragMove);
                    document.removeEventListener('mouseup', dragEnd);
                    document.removeEventListener('touchmove', dragMove);
                    document.removeEventListener('touchend', dragEnd);
                };

                document.addEventListener('mousemove', dragMove);
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('touchend', dragEnd);
            };

            target.addEventListener('mousedown', dragStart);
            target.addEventListener('touchstart', dragStart, { passive: false });
        }

        // Init App
        function init() {
            getElements();
            if (audioBtn) audioBtn.textContent = audioEnabled ? '🔊' : '🔇';
            if (autoMinBtn) autoMinBtn.textContent = autoMinimizeOnComplete ? '🎈 TỰ ẨN' : '📌 GIỮ NGUYÊN';
            
            const savedTime = safeStorage.getItem('openclaw_countdown_last_time');
            const parsed = parseInt(savedTime, 10);
            if (!isNaN(parsed) && parsed > 0) {
                countdownTime = parsed;
                initialSetTime = parsed;
                inputBuffer = String(parsed).padStart(3, '0');
            } else {
                countdownTime = 30;
                initialSetTime = 30;
                inputBuffer = "030";
            }

            if (statusText) statusText.textContent = "SẴN SÀNG";
            updateDisplay();

            makeDraggable(floatingWidget, widgetHeader);
            makeDraggable(floatingBubble, null);

            initPiPElements();

            if (window.AndroidBridge) {
                document.body.classList.add('is-android-native');
                setTimeout(syncNativeBounds, 120);
            }
        }

        // ==========================================
        // PICTURE-IN-PICTURE (PiP) CANVAS ENGINE
        // Zero permissions required on Android Box!
        // ==========================================
        let pipCanvas = null;
        let pipCtx = null;
        let pipVideo = null;
        let isPiPActive = false;
        let pipBtn = null;

        function initPiPElements() {
            pipBtn = document.getElementById('pipBtn');
            if (!pipCanvas) {
                pipCanvas = document.createElement('canvas');
                pipCanvas.width = 480;
                pipCanvas.height = 270;
                pipCanvas.style.display = 'none';
                document.body.appendChild(pipCanvas);
                pipCtx = pipCanvas.getContext('2d');
            }
            if (!pipVideo) {
                pipVideo = document.createElement('video');
                pipVideo.autoplay = true;
                pipVideo.muted = true;
                pipVideo.playsInline = true;
                pipVideo.style.display = 'none';
                document.body.appendChild(pipVideo);

                pipVideo.addEventListener('enterpictureinpicture', () => {
                    isPiPActive = true;
                    updatePiPButtonState();
                    if (floatingWidget) floatingWidget.classList.add('hidden');
                    if (floatingBubble) floatingBubble.classList.add('hidden');
                });
                pipVideo.addEventListener('leavepictureinpicture', () => {
                    isPiPActive = false;
                    updatePiPButtonState();
                    if (countdownTime <= 0) {
                        if (floatingWidget) floatingWidget.classList.add('hidden');
                        if (floatingBubble) floatingBubble.classList.remove('hidden');
                    } else {
                        if (floatingWidget) floatingWidget.classList.remove('hidden');
                        if (floatingBubble) floatingBubble.classList.add('hidden');
                    }
                });
            }
            renderPiPCanvas();
        }

        function updatePiPButtonState() {
            pipBtn = document.getElementById('pipBtn');
            if (!pipBtn) return;
            if (isPiPActive) {
                pipBtn.textContent = '❌ TẮT PiP';
                pipBtn.style.background = 'rgba(255, 0, 85, 0.35)';
                pipBtn.style.borderColor = 'var(--danger)';
                pipBtn.style.color = '#ff4d8d';
            } else {
                pipBtn.textContent = '📺 CỬA SỔ NỔI';
                pipBtn.style.background = 'rgba(0, 243, 255, 0.22)';
                pipBtn.style.borderColor = 'var(--primary)';
                pipBtn.style.color = 'var(--primary)';
            }
        }

        function renderPiPCanvas() {
            if (!pipCtx) return;
            const w = pipCanvas.width;
            const h = pipCanvas.height;

            let strokeColor = '#00f3ff';
            let glowColor = 'rgba(0, 243, 255, 0.6)';
            let currentStatus = statusText ? statusText.textContent : 'SẴN SÀNG';

            if (countdownTime <= 0) {
                strokeColor = '#00ff88';
                glowColor = 'rgba(0, 255, 136, 0.7)';
                currentStatus = 'HOÀN THÀNH 🎉';
            } else if (countdownTime <= 5 && isRunning) {
                strokeColor = '#ff0055';
                glowColor = 'rgba(255, 0, 85, 0.85)';
                currentStatus = 'CẢNH BÁO! ⚠️';
            } else if (countdownTime <= 10 && isRunning) {
                strokeColor = '#ffaa00';
                glowColor = 'rgba(255, 170, 0, 0.75)';
                currentStatus = 'SẮP HẾT GIỜ ⏱️';
            } else if (isRunning) {
                currentStatus = 'ĐANG ĐẾM... ⏱️';
            }

            pipCtx.fillStyle = '#060a12';
            pipCtx.fillRect(0, 0, w, h);

            const grad = pipCtx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#040711');
            pipCtx.fillStyle = grad;
            pipCtx.fillRect(6, 6, w - 12, h - 12);

            pipCtx.lineWidth = 6;
            pipCtx.strokeStyle = strokeColor;
            pipCtx.shadowColor = glowColor;
            pipCtx.shadowBlur = 18;
            pipCtx.strokeRect(10, 10, w - 20, h - 20);

            pipCtx.shadowBlur = 0;

            pipCtx.font = 'bold 22px Inter, sans-serif';
            pipCtx.fillStyle = strokeColor;
            pipCtx.textAlign = 'center';
            pipCtx.textBaseline = 'top';
            pipCtx.fillText(currentStatus, w / 2, 22);

            const formatted = String(countdownTime).padStart(3, '0');
            pipCtx.font = '900 110px Orbitron, "Courier New", monospace';
            pipCtx.fillStyle = strokeColor;
            pipCtx.shadowColor = glowColor;
            pipCtx.shadowBlur = 24;
            pipCtx.textAlign = 'center';
            pipCtx.textBaseline = 'middle';
            pipCtx.fillText(formatted, w / 2, 132);

            pipCtx.shadowBlur = 0;

            pipCtx.font = 'bold 18px Inter, sans-serif';
            pipCtx.fillStyle = '#94a3b8';
            pipCtx.textBaseline = 'bottom';
            pipCtx.fillText('GIÂY', w / 2, 218);

            pipCtx.font = '12px Inter, sans-serif';
            pipCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            pipCtx.fillText('Digital Countdown • Android Box Ô Tô', w / 2, 248);
        }

        async function togglePiP(e) {
            if (e && e.stopPropagation) e.stopPropagation();

            initPiPElements();

            if (document.pictureInPictureElement) {
                try {
                    await document.exitPictureInPicture();
                } catch(err) {}
            } else {
                if (!document.pictureInPictureEnabled && !pipVideo.requestPictureInPicture) {
                    alert("Trình duyệt Android Box không hỗ trợ Picture-in-Picture (PiP). Vui lòng dùng Chrome hoặc Kiwi Browser.");
                    return;
                }

                try {
                    renderPiPCanvas();

                    if (!pipVideo.srcObject) {
                        const stream = pipCanvas.captureStream(30);
                        pipVideo.srcObject = stream;
                    }

                    await pipVideo.play();
                    await pipVideo.requestPictureInPicture();

                    if ('mediaSession' in navigator) {
                        try {
                            navigator.mediaSession.metadata = new MediaMetadata({
                                title: `Đếm ngược: ${countdownTime}s`,
                                artist: 'Android Box Ô Tô',
                                album: 'Digital Floating Countdown'
                            });
                            navigator.mediaSession.setActionHandler('play', () => { startTimer(); });
                            navigator.mediaSession.setActionHandler('pause', () => { pauseTimer(); });
                        } catch(mErr) {}
                    }
                } catch(err) {
                    console.error("Lỗi PiP:", err);
                    alert("Vui lòng chạm tương tác với màn hình 1 lần trước khi bấm nút Cửa Sổ Nổi PiP.");
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
