name: Build Zalo Notification Sound Pro APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "Android_Zalo_Sound/**"
      - ".github/workflows/build_zalo_sound.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Android_Zalo_Sound/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -noprompt -alias openclaw -keyalg RSA -keysize 2048 -validity 10000 -keystore Android_Zalo_Sound/app/release.keystore -storepass openclaw123 -keypass openclaw123 -dname "CN=ZaloSoundPro, OU=OpenClaw, O=OpenClaw, L=HCM, ST=HCM, C=VN" -storetype JKS

    - name: Build APK
      run: |
        cd Android_Zalo_Sound
        gradle assembleRelease --stacktrace

    - name: Upload Zalo Notification Sound Pro APK
      uses: actions/upload-artifact@v4
      with:
        name: Zalo_Notification_Sound_Pro_APK
        path: Android_Zalo_Sound/app/build/outputs/apk/release/Zalo_Notification_Sound_Pro_v1.0.apk
