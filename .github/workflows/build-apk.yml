name: Build Android Overlay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Standalone HTML to Android Assets
        run: |
          mkdir -p Android_Project/app/src/main/assets
          cp countdown_standalone.html Android_Project/app/src/main/assets/countdown_standalone.html

      - name: Build APK with Gradle
        run: |
          cd Android_Project
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../DigitalCountdown_Floating_v1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCountdown-Floating-APK
          path: DigitalCountdown_Floating_v1.apk
