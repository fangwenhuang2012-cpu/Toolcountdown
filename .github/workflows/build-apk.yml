name: Build Android Overlay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > Android_Project/local.properties

      - name: Sync Standalone HTML to Android Assets
        run: cp countdown_standalone.html Android_Project/app/src/main/assets/countdown_standalone.html

      - name: Build APK with Gradle
        run: |
          cd Android_Project
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Floating-Countdown-APK
          path: Android_Project/app/build/outputs/apk/debug/app-debug.apk
